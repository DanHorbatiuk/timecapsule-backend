app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  user-max-capsules: 5
  user-max-attachments-per-capsule: 10
  premium-user-max-capsules: 20
  premium-user-max-attachments-per-capsule: 40

spring:
  profiles:
    default: prod
  application:
    name: timecapsule

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
    open-in-view: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_ADDRESS}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 40MB
      resolve-lazily: true

  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100

aws:
  access-key: ${S3_ACCESS_KEY}
  secret-key: ${S3_SECRET_KEY}
  region: ${AWS_REGION}
  bucket: ${S3_BUCKET}
  lambda-arn: ${LAMBDA_ARN}
  scheduler-role-arn: ${SCHEDULER_ROLE_ARN}
  s3:
    files-folder: ${FILE_FOLDER_NAME:files}
    data-folder: ${DATA_FOLDER_NAME:data}
    max-file-size: 10MB
    presigned-url-expiration-ms: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MS:3600000}

jwt:
  secret:
    key: ${JWT_SECRET}
    access-token-expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: TimeCapsule
    version: 1.0.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
