services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: timecapsule
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-timecapsule_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timecapsule"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: timecapsule-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      DB_URL: jdbc:postgresql://db:5432/timecapsule
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-timecapsule_dev}
      JWT_SECRET: ${JWT_SECRET:-changeme_at_least_32_chars_long_secret}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_ADDRESS: ${MAIL_ADDRESS:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dummy}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dummy}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-timecapsule-bucket}
      FILE_FOLDER_NAME: ${FILE_FOLDER_NAME:-files}
      DATA_FOLDER_NAME: ${DATA_FOLDER_NAME:-data}
      AWS_S3_PRESIGNED_URL_EXPIRATION_MS: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MS:-3600000}
      LAMBDA_ARN: ${LAMBDA_ARN:-arn:aws:lambda:us-east-1:000000000000:function:dummy}
      SCHEDULER_ROLE_ARN: ${SCHEDULER_ROLE_ARN:-arn:aws:iam::000000000000:role/dummy}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata:
